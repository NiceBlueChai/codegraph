[package]
name = "codegraph"
version = "0.1.0"
edition = "2021"
description = "Supercharge Claude Code with semantic code intelligence - Rust implementation"
license = "MIT"
authors = ["CodeGraph Contributors"]

[[bin]]
name = "codegraph"
path = "src/main.rs"

[lib]
name = "codegraph"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Tree-sitter parsing
tree-sitter = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
libloading = "0.8"

# Parallel processing
rayon = "1.8"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"

# File watching
notify = "6.1"

# Utilities
sha2 = "0.10"
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
regex = "1.10"
globset = "0.4"
ignore = "0.4"

# String interning for performance
string_cache = "0.8"

# FFI support
libc = "0.2"

[dev-dependencies]
tempfile = "3.9"
criterion = "0.5"

[[bench]]
name = "indexing"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
